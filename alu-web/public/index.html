<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta

    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- <div id='notification-component' data-username='testuser'></div> -->
    <!-- <div id='study-component' data-deck-id=1></div> -->
    <!-- <div class='flashcard-list' data-deck-id=1></div> -->
    <!-- <div id='create-flashcard' data-deck-id=1 data-flashcard-id=12></div> -->
    <div class='profile-badge' data-username='testuser' data-current-user-username='evolvedsquid'></div>
    <!-- <div id='decks-feed'></div> -->
    <!-- <div id='deck-container'></div> -->
    <!-- <div id="user_decks" data-username="evolvedsquid" data-can-Create-Deck="true"></div> -->

    <!-- TODO: Remove this, will require updates in `build-react-into-django.py` -->
    <script>
      var path = window.location.pathname;
      var idRegex = /(?<deckid>\d+)/;
      var match = path.match(idRegex);
      if (match) {
        var deckId = match.groups.deckid;
        var userDecksEl = document.getElementById('user_decks');
        userDecksEl.className = 'd-none';
        var deckEl = "<div class='deck-detail' data-deck-id='" + deckId + "' data-class-name='col-6 mx-auto'></div>";
        var mainContainer = document.getElementById('deck-container');
        mainContainer.innerHTML = deckEl;
      };
    </script>
  </body>
</html>

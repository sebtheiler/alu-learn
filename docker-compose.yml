version: '3.8'

services:
  alu-learn:
    build: .
    container_name: alu-learn
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      - DATABASE_URL=postgresql://alu:password@postgres:5432/alulearn

      # NextAuth / App
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=changeme_to_a_random_string
      - SECRET=changeme_to_a_random_string
      - STRIPE_SECRET_KEY=dummy_val_for_local_testing

      # Google Auth (Required for login)
      - NEXT_PUBLIC_GOOGLE_ID=your_google_client_id
      - GOOGLE_SECRET=your_google_client_secret

      # Feature Flags
      - NEXT_PUBLIC_ALU_PRO_TRIAL_DAYS=14
      - NODE_ENV=production

      # Email
      - EMAIL_SERVER_HOST=maildev
      - EMAIL_SERVER_PORT=1025
      - EMAIL_SERVER_USER=none
      - EMAIL_SERVER_PASSWORD=none
      - EMAIL_FROM=noreply@localhost
    depends_on:
      - postgres
      - maildev

  maildev:
    image: maildev/maildev
    container_name: alu-maildev
    ports:
      - "1080:1080" # Web Interface
      - "1025:1025" # SMTP Port

  postgres:
    image: postgres:15-alpine
    container_name: alu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alu
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alulearn
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

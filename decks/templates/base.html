<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Alu Learn helps you take notes and study all in one place">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/11201b2070.js"></script>
    {% include 'react/css.html' %}

    <!-- Title and favicon -->
    <title>{% block title %}{% endblock title %} Alu Learn</title>
    <link rel="shortcut icon" type="image/png" href="/static/favicon.ico"/>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.css" integrity="sha384-zTROYFVGOfTw7JV7KUu8udsvW2fx4lWOsCEDqhBreBwlHI4ioVRtmIvEThzJHGET" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.js" integrity="sha384-GxNFqL3r9uRJQhR+47eDxuPoNE7yLftQM8LcxzgS4HT73tp970WS/wV5p8UzCOmb" crossorigin="anonymous"></script>
  </head>
  <body>
    <noscript>
      For full functionality of this site it is necessary to enable JavaScript.
      Here are the <a href="https://www.enable-javascript.com/">
      instructions how to enable JavaScript in your web browser</a>.
    </noscript>

    {% include 'components/navbar.html' %}
    <div class='container-fluid'>
      {% block content %}
      {% endblock content %}
    </div>
    {% include 'react/base_embed.html' %}
    {% include 'react/js.html' %}
  </body>
</html>

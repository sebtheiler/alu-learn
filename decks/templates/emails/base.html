<!DOCTYPE html>
<html>
  <head>
    <style>
      .table {
        margin-left: auto;
        margin-right: auto;
        white-space: pre-wrap;
      }

      .container {
        padding-right: 15px;
        padding-left: 15px;
        margin-right: auto;
        margin-left: auto;
      }
      @media (min-width: 768px) {
        .container {
          width: 750px;
        }
      }
      @media (min-width: 992px) {
        .container {
          width: 970px;
        }
      }
      @media (min-width: 1200px) {
        .container {
          width: 1170px;
        }
      }

      .title {
        text-align: center;
      }

      .navbar-brand {
        padding-top: 0.3125rem;
        padding-bottom: 0.3125rem;
        margin-right: 1rem;
        font-size: 1.25rem;
        white-space: nowrap;
        text-decoration: none;
        color: black;
      }

      .button {
        -webkit-appearance: button;
        -moz-appearance: button;
        appearance: button;
        text-decoration: none;

        background-color: #007bff; /* Primary-blue */
        border: none;
        color: white!important; /* I know !important is bad practice, but whatever */
        padding: 10px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 4px;
        margin: 0 auto;
        width: 200px;
      }
    </style>
  </head>
  <body>
    {% block content %}
    {% endblock content %}

    <small>Sent by Alu Learn | NYC, New York</small><br>
    <small>
      <a href='https://www.alulearn.com/settings/'>Unsubscribe</a> from emails</a> | 
      <a href='https://www.alulearn.com/contactus/'>Contact Us</a> | 
      <a href='https://www.alulearn.com/legal/privacypolicy/'>Privacy Policy</a> | 
      <a href='https://www.alulearn.com/legal/tos/'>Terms of Service</a>
    </small>
  </body>
</html>

{% extends 'base.html' %}

{% block title %}{{ username }}'s profile at{% endblock title %}


{% block content %}
<div class='container mt-3'>
  <div class='profile-badge' data-username='{{ username }}' data-current-user-username='{{ current_user_username }}'></div>
  <h3 class='mt-5'>User's shared decks</h3>
  <div id='user_decks'
    data-username="{{ username }}"
    data-can-Create-Deck="false">
  </div>
</div>
{% endblock content %}
